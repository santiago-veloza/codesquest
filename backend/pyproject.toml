[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.pruebas"
python_files = ["test_*.py"]
addopts = "--strict-markers -q"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna
# DJ: buenas prácticas de Django · S: seguridad (bandit)
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"] # assert y contraseñas de prueba están permitidos en tests
