<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba del puente React ↔ Godot</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #0b1020; color: #e2e8f0; }
    iframe { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; border: 1px solid #334155; display: block; }
    textarea { width: 100%; max-width: 960px; height: 80px; font-family: ui-monospace, monospace; }
    button { margin: 8px 8px 8px 0; padding: 8px 14px; }
    #registro { font-family: ui-monospace, monospace; white-space: pre-wrap; max-width: 960px; }
  </style>
</head>
<body>
  <h1>Prueba del puente React ↔ Godot</h1>
  <p>Simula lo que hará React: envía una ColaDeAcciones a la escena y muestra los eventos que devuelve.</p>
  <iframe id="juego" src="../build/web/index.html" title="Escena del juego"></iframe>
  <label for="cola">ColaDeAcciones (JSON)</label>
  <textarea id="cola">{"version": 1, "acciones": [{"tipo": "avanzar"}, {"tipo": "saltar"}, {"tipo": "avanzar"}, {"tipo": "atacar"}]}</textarea>
  <div>
    <button id="reproducir" disabled>▶ Reproducir</button>
    <button id="invalida" disabled>Enviar acción inválida</button>
    <label><input type="checkbox" id="reducir"> Reducir movimiento</label>
  </div>
  <div id="registro" role="log" aria-live="polite"></div>

  <script>
    const juego = document.getElementById('juego');
    const registro = document.getElementById('registro');
    const botones = [document.getElementById('reproducir'), document.getElementById('invalida')];
    const inicio = performance.now();

    // Lo que React expondrá a Godot. Se registra antes de que el motor termine de cargar.
    const host = {
      recibirEvento(nombre, datosJson) {
        anotar(`evento: ${nombre} ${datosJson}`);
        if (nombre === 'escena_lista') {
          anotar(`escena lista en ${Math.round(performance.now() - inicio)} ms`);
          botones.forEach((b) => { b.disabled = false; });
        }
      },
    };
    juego.contentWindow.codequestHost = host;
    juego.addEventListener('load', () => { juego.contentWindow.codequestHost = host; });

    function anotar(texto) {
      registro.textContent += texto + '\n';
      console.log('[prueba]', texto);
    }

    function godot() {
      return juego.contentWindow.codequestGodot;
    }

    document.getElementById('reproducir').addEventListener('click', () => {
      godot().reproducir(document.getElementById('cola').value);
    });
    document.getElementById('invalida').addEventListener('click', () => {
      godot().reproducir('{"version": 1, "acciones": [{"tipo": "borrar_disco"}]}');
    });
    document.getElementById('reducir').addEventListener('change', (e) => {
      godot().configurar(JSON.stringify({ movimiento_reducido: e.target.checked }));
    });
  </script>
</body>
</html>
